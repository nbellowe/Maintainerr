name: "Release - Reusable PR Image Build"

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      image_tag:
        type: string
        required: true

concurrency:
  group: release-pr-images-${{ inputs.pr_number }}-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  DOCKERHUB_SLUG: maintainerr/maintainerr
  GHCR_SLUG: ghcr.io/maintainerr/maintainerr

jobs:
  build-docker-image:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set outputs
        id: vars
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_SLUG }},${{ env.GHCR_SLUG }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

  merge:
    name: Merge Docker digests and push
    runs-on: ubuntu-latest
    needs:
      - build-docker-image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ needs.build-docker-image.outputs.sha }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          dockerhub_slug='${{ env.DOCKERHUB_SLUG }}'
          ghcr_slug='${{ env.GHCR_SLUG }}'
          dockerhub_sources=''
          ghcr_sources=''

          for digest in *; do
            dockerhub_sources="${dockerhub_sources}${dockerhub_slug}@sha256:${digest} "
            ghcr_sources="${ghcr_sources}${ghcr_slug}@sha256:${digest} "
          done

          docker buildx imagetools create \
            $(jq -cr --arg slug "$dockerhub_slug" '.tags | map(select(startswith($slug)) | "--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${dockerhub_sources}
          docker buildx imagetools create \
            $(jq -cr --arg slug "$ghcr_slug" '.tags | map(select(startswith($slug)) | "--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${ghcr_sources}

      - name: Notify of release
        if: always()
        uses: mshick/add-pr-comment@v3
        with:
          allow-repeats: true
          message-success: |
            Released to `maintainerr/maintainerr:${{ inputs.image_tag }}` and
            `ghcr.io/maintainerr/maintainerr:${{ inputs.image_tag }}` :rocket:
          message-failure: |
            :bangbang: There was an error trying to release the PR.
          issue: ${{ inputs.pr_number }}
