name: "PR Comment - Build Release Images"

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  resolve-pr:
    name: Resolve PR context
    if: >-
      ${{
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/release-pr') &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.pr.outputs.should_run }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Gather PR metadata
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const headRepo = pr.head.repo?.full_name ?? '';
            const headSha = pr.head.sha;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const shouldRun = headRepo === repoFullName;

            core.setOutput('head_repo', headRepo);
            core.setOutput('head_sha', headSha);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

            if (!shouldRun) {
              core.warning(
                `Refusing to run privileged release workflow on forked repository ${headRepo}.`,
              );
            }

      - name: Notify unsupported fork
        if: steps.pr.outputs.should_run == 'false' && steps.pr.outputs.head_repo != ''
        uses: mshick/add-pr-comment@v3
        with:
          allow-repeats: false
          issue: ${{ github.event.issue.number }}
          message: |
            :lock: Release builds can only be triggered for branches in the
            `${{ github.repository }}` repository. This prevents running
            privileged jobs on forks.

  build-release-images:
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.should_run == 'true' }}
    name: Build and publish release images
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: ./.github/workflows/release_reusable_build_pr_images.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve-pr.outputs.head_sha }}
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      image_tag: pr-${{ needs.resolve-pr.outputs.pr_number }}
      comment_id: ${{ github.event.comment.id }}
